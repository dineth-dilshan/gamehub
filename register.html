<!DOCTYPE html>
<html lang="en">
<head>
    <title>Gamers Hub - Create Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CSS STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121622; /* Dark deep blue */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.3;
        }

        .main-wrapper {
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* Header & Avatar */
        .avatar-glow {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.8), 0 0 60px rgba(236, 72, 153, 0.6);
            animation: avatarGlow 2s ease-in-out infinite;
        }

        @keyframes avatarGlow {
            0%, 100% {
                box-shadow: 0 0 30px rgba(168, 85, 247, 0.8), 0 0 60px rgba(236, 72, 153, 0.6);
            }
            50% {
                box-shadow: 0 0 50px rgba(168, 85, 247, 1), 0 0 80px rgba(236, 72, 153, 0.8);
            }
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        /* Card Styling */
        .register-card {
            background-color: #1e2533;
            padding: 40px 30px;
            border-radius: 12px;
            border: 1px solid #2d3748;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #999999;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .input-field {
            background-color: #2d3748;
            border-radius: 8px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            position: relative;
            border: 1px solid transparent;
            transition: border-color 0.3s;
        }

        .input-field:focus-within {
            border-color: #a855f7;
        }

        .input-field i:first-child {
            color: #64748b;
            margin-right: 10px;
        }

        .input-field input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            width: 100%;
        }

        .input-field input::placeholder {
            color: #64748b;
        }

        #toggleIcon {
            color: #64748b;
            cursor: pointer;
            transition: color 0.3s;
        }

        #toggleIcon:hover {
            color: #a855f7;
        }

        /* Password Strength Indicator */
        .password-strength {
            margin-top: 5px;
            height: 3px;
            background-color: #2d3748;
            border-radius: 3px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s, background-color 0.3s;
        }

        .strength-bar.weak {
            width: 33%;
            background-color: #ef4444;
        }

        .strength-bar.medium {
            width: 66%;
            background-color: #f59e0b;
        }

        .strength-bar.strong {
            width: 100%;
            background-color: #10b981;
        }

        /* Buttons */
        .register-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(to right, #9333ea, #db2777);
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: opacity 0.3s;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .register-btn:hover {
            opacity: 0.9;
        }

        /* Terms & Conditions */
        .terms-check {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .terms-check input {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .terms-check a {
            color: #a855f7;
            text-decoration: none;
        }

        .terms-check a:hover {
            text-decoration: underline;
        }

        /* Divider */
        .divider {
            margin: 25px 0;
            position: relative;
            border-bottom: 1px solid #2d3748;
        }

        .divider span {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2533;
            padding: 0 10px;
            color: #64748b;
            font-size: 0.75rem;
        }

        .social-login {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .social-btn {
            background: transparent;
            border: 1px solid #2d3748;
            color: white;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: background 0.3s, border-color 0.3s;
        }

        .social-btn:hover {
            background: #2d3748;
            border-color: #a855f7;
        }

        .footer-text {
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .footer-text a {
            color: #a855f7;
            text-decoration: none;
            font-weight: bold;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        /* Bottom Features */
        .features-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 30px;
        }

        .feature-card {
            background-color: #1e2533;
            padding: 15px 5px;
            border-radius: 10px;
            border: 1px solid #2d3748;
        }

        .feature-card i {
            font-size: 1.5rem;
            margin-bottom: 8px;
            display: block;
        }

        .feature-card span {
            font-size: 0.7rem;
            color: #94a3b8;
        }

        .gold {
            color: #fbbf24;
        }

        .blue {
            color: #3b82f6;
        }

        .green {
            color: #10b981;
        }

        /* Two Column Layout for Inputs */
        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .input-row .input-group {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <video class="bg-video" autoplay muted loop playsinline>
        <source src="33.mp4" type="video/mp4">
    </video>

    <div class="main-wrapper">
        <div class="header">
            <div class="avatar-glow">
                <i class="fas fa-user-plus"></i>
            </div>
            <h1>JOIN THE HUB</h1>
            <p class="subtitle">Create your gaming account and start playing</p>
        </div>

        <div class="register-card">
            <div id="messageBox" style="display:none; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: left;" role="status" aria-live="polite"></div>
            <form id="registerForm">
                <div class="input-row">
                    <div class="input-group">
                        <label>First Name</label>
                        <div class="input-field">
                            <i class="fas fa-user"></i>
                            <input type="text" name="first_name" placeholder="First Name" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Last Name</label>
                        <div class="input-field">
                            <i class="fas fa-user"></i>
                            <input type="text" name="last_name" placeholder="Last Name" required>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <div class="input-field">
                        <i class="fas fa-envelope"></i>
                        <input type="email" name="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Username</label>
                    <div class="input-field">
                        <i class="fas fa-at"></i>
                        <input type="text" name="username" placeholder="Choose a username" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="input-field">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="passwordInput" name="password" placeholder="Create password" required>
                        <i class="far fa-eye" id="toggleIcon"></i>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <div class="input-field">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPasswordInput" name="confirm_password" placeholder="Confirm password" required>
                    </div>
                </div>

                <div class="terms-check">
                    <input type="checkbox" id="termsCheck" required>
                    <label for="termsCheck">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                </div>

                <button type="submit" class="register-btn">
                    <i class="fas fa-user-check"></i> CREATE ACCOUNT
                </button>
            </form>

            <div class="divider">
                <span>OR SIGN UP WITH</span>
            </div>

            <div class="social-login">
                <button class="social-btn" title="Steam"><i class="fab fa-steam"></i></button>
                <button class="social-btn" title="Discord"><i class="fab fa-discord"></i></button>
                <button class="social-btn" title="Google"><i class="fab fa-google"></i></button>
            </div>

            <p class="footer-text">Already have an account? <a href="8.Logintab.html">Sign In Here</a></p>
        </div>

        <div class="features-row">
            <div class="feature-card">
                <i class="fas fa-trophy gold"></i>
                <span>Win Rewards</span>
            </div>
            <div class="feature-card">
                <i class="fas fa-users blue"></i>
                <span>Join Teams</span>
            </div>
            <div class="feature-card">
                <i class="fas fa-chart-line green"></i>
                <span>Track Stats</span>
            </div>
        </div>
    </div>

    <script>
        // Password visibility toggle
        const toggleIcon = document.getElementById('toggleIcon');
        const passwordInput = document.getElementById('passwordInput');

        toggleIcon.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // Password strength indicator
        const passwordStrengthInput = document.getElementById('passwordInput');
        const strengthBar = document.getElementById('strengthBar');

        passwordStrengthInput.addEventListener('input', function() {
            const password = this.value;
            let strength = 0;

            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;

            strengthBar.classList.remove('weak', 'medium', 'strong');

            if (strength <= 1) {
                strengthBar.classList.add('weak');
            } else if (strength <= 2) {
                strengthBar.classList.add('medium');
            } else {
                strengthBar.classList.add('strong');
            }
        });

        // Form submission with PHP
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('passwordInput').value;
            const confirmPassword = document.getElementById('confirmPasswordInput').value;
            const messageBox = document.getElementById('messageBox');
            
            if (password !== confirmPassword) {
                messageBox.innerHTML = 'Passwords do not match!';
                messageBox.style.backgroundColor = '#fee2e2';
                messageBox.style.color = '#991b1b';
                messageBox.style.display = 'block';
                return;
            }

            const formData = new FormData(this);
            
            // Log all form data being sent
            console.log("Form submission started...");
            for (let [key, value] of formData) {
                console.log(key + ": " + value);
            }
            
            fetch('register_handler.php', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                console.log("Response status:", response.status);
                return response.text();
            })
            .then(text => {
                console.log("Raw response:", text);
                try {
                    const data = JSON.parse(text);
                    messageBox.style.display = 'block';
                    if (data.success) {
                        messageBox.innerHTML = data.message;
                        messageBox.style.backgroundColor = '#dcfce7';
                        messageBox.style.color = '#166534';
                        setTimeout(() => {
                            window.location.href = '8.Logintab.html';
                        }, 1500);
                    } else {
                        messageBox.innerHTML = data.message;
                        messageBox.style.backgroundColor = '#fee2e2';
                        messageBox.style.color = '#991b1b';
                    }
                } catch(e) {
                    console.error("JSON parse error:", e);
                    messageBox.innerHTML = 'Server error: ' + text;
                    messageBox.style.backgroundColor = '#fee2e2';
                    messageBox.style.color = '#991b1b';
                    messageBox.style.display = 'block';
                }
            })
            .catch(error => {
                console.error('Fetch error:', error);
                messageBox.innerHTML = 'An error occurred. Please try again.';
                messageBox.style.backgroundColor = '#fee2e2';
                messageBox.style.color = '#991b1b';
                messageBox.style.display = 'block';
            });
        });
    </script>

</body>
</html>
