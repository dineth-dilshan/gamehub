    <script>
        function loadWishlist() {
            fetch('get_wishlist.php')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('wishlistContainer');
                    if (data.items && data.items.length > 0) {
                        let html = '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">';
                        data.items.forEach(item => {
                            html += `
                                <div style="background-color: #1e293b; border-radius: 10px; border: 1px solid #2d3748; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.3s;">
                                    <div style="padding: 15px; background-color: #0f172a; border-bottom: 1px solid #2d3748;">
                                        <div style="font-weight: bold; font-size: 1rem; margin-bottom: 5px;">${item.product_name}</div>
                                        <div style="color: #26b6ff; font-size: 1.1rem; font-weight: bold;">Rs. ${item.product_price}</div>
                                    </div>
                                    <div style="padding: 15px; display: flex; gap: 10px;">
                                        <button onclick="addToCart(${item.product_id}, '${item.product_name}', ${item.product_price})" style="flex: 1; padding: 10px; background-color: #26b6ff; color: #050814; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Add to Cart</button>
                                        <button onclick="removeFromWishlist(${item.id})" style="flex: 0.3; background-color: #ef4444; color: #ffffff; border: none; border-radius: 4px; cursor: pointer;">Remove</button>
                                    </div>
                                </div>
                            `;
                        });
                        html += '</div>';
                        container.innerHTML = html;
                    } else {
                        container.innerHTML = '<div style="text-align: center; padding: 60px 20px; color: #94a3b8;"><i class="fas fa-heart" style="font-size: 4rem; margin-bottom: 20px; opacity: 0.5; display: block;"></i><p>Your wishlist is empty</p><a href="storehome.html" style="color: #26b6ff; text-decoration: underline;">Start shopping</a></div>';
                    }
                });
        }

        function removeFromWishlist(itemId) {
            const formData = new FormData();
            formData.append('wishlist_id', itemId);

            fetch('remove_from_wishlist.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    loadWishlist();
                    alert('Item removed from wishlist');
                }
            });
        }

        function addToCart(productId, productName, productPrice) {
            const formData = new FormData();
            formData.append('product_id', productId);
            formData.append('product_name', productName);
            formData.append('product_price', productPrice);
            formData.append('quantity', 1);

            fetch('add_to_cart.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Item added to cart!');
                    window.location.href = 'cart.html';
                }
            });
        }

        // Load wishlist on page load
        loadWishlist();

        // Avatar dropdown toggle
        function toggleDropdown(event) {
            event.stopPropagation();
            const menu = document.getElementById('dropdownMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function() {
            const menu = document.getElementById('dropdownMenu');
            if (menu) menu.style.display = 'none';
        });

        // Logout function
        function logout() {
            window.location.href = 'logout.php';
        }

        // Load cart count
        function loadCartCount() {
            fetch('get_cart_count.php')
                .then(response => response.json())
                .then(data => {
                    const cartCount = document.getElementById('cartCount');
                    if (data.count > 0) {
                        cartCount.textContent = data.count;
                        cartCount.style.display = 'flex';
                    } else {
                        cartCount.style.display = 'none';
                    }
                });
        }

        // Load counts on page load
        loadCartCount();
        setInterval(loadCartCount, 5000);
    </script>
