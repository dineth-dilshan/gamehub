<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Game Library | The Gamer's HUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --dark-bg: #0b141a;
            --nav-bg: #121c24;
            --accent-blue: #3b82f6;
            --card-bg: #1e293b;
            --text-white: #ffffff;
            --text-gray: #94a3b8;
            --border-color: #334155;
            --cat-action: #ef4444;
            --cat-rpg: #8b5cf6;
            --cat-racing: #f59e0b;
            --cat-shooting: #10b981;
            --cat-strategy: #3b82f6;
            --cat-sports: #ec4899;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-white); line-height: 1.6; }

        /* --- Navbar --- */
        nav {
            background-color: var(--nav-bg);
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 1000;
        }
        .nav-left, .logo { font-weight: 800; display: flex; align-items: center; gap: 10px; text-transform: uppercase; }
        .logo { color: #ffffff; }
        .logo span {
            animation: glow 2s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% {
                color: #ffffff;
                text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            }
            50% {
                color: #26b6ff;
                text-shadow: 0 0 20px rgba(38, 182, 255, 0.8), 0 0 30px rgba(38, 182, 255, 0.5);
            }
        }
        .logo i { color: var(--accent-blue); }
        .nav-center { display: flex; align-items: center; }
        .nav-links { display: flex; list-style: none; gap: 20px; }
        .nav-links a { text-decoration: none; color: var(--text-gray); font-size: 0.8rem; transition: 0.3s; }
        .nav-links a.active { color: var(--text-white); font-weight: bold; }
        .nav-links a:hover { color: var(--text-white); }
        .nav-right a:hover { color: var(--text-white); }
        .menu-toggle { display: none; font-size: 1.5rem; cursor: pointer; border-radius: 40px; }
        .search-wrap { display: inline-flex; align-items: center; border-radius: 999px; overflow: visible; position: relative; }
        .search-input { width: 0; opacity: 0; padding: 6px 12px 6px 12px; border-radius: 20px; border: none; outline: none; transition: width 220ms ease, opacity 220ms ease, padding 220ms ease; background: #ffffff; color: #0b141a; font-size: 0.9rem; }
        .search-icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--text-gray); background: transparent; padding: 6px; border-radius: 50%; cursor: pointer; transition: color 180ms ease, transform 180ms ease; }
        .search-wrap:hover .search-input, .search-wrap:focus-within .search-input { width: 180px; opacity: 1; padding: 6px 12px 6px 40px; }

        /* --- Header --- */
        .filter-header { padding: 50px 5% 30px; text-align: center; }
        .filter-header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .filter-header p { color: var(--text-gray); margin-bottom: 30px; }
        .filter-tags { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .tag-btn {
            padding: 10px 22px; background: var(--card-bg); border: 1px solid var(--border-color);
            color: var(--text-gray); border-radius: 30px; cursor: pointer; font-size: 0.85rem; transition: 0.3s;
        }
        .tag-btn:hover, .tag-btn.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }

        /* --- Games Grid --- */
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }

        .game-card {
            background: var(--card-bg); border-radius: 12px; overflow: hidden;
            border: 1px solid var(--border-color); transition: 0.3s ease;
        }
        .game-card:hover { transform: translateY(-8px); border-color: var(--accent-blue); }

        .game-thumb {
            height: 180px; background: #2d3748; position: relative;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .game-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .game-thumb i { font-size: 3.5rem; color: rgba(255,255,255,0.05); }

        .cat-badge {
            position: absolute; top: 12px; left: 12px;
            padding: 4px 10px; border-radius: 4px; font-size: 0.65rem;
            font-weight: 800; text-transform: uppercase;
            background: transparent; border: 1px solid rgba(238,233,233,0.12);
            color: var(--badge-color, #fff); backdrop-filter: blur(4px);
            display: none;
        }

        .game-info { padding: 20px; }
        .game-title { font-size: 1rem; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .game-meta { font-size: 0.8rem; color: var(--text-gray); margin-bottom: 15px; display: block; }

        /* Download button — default state */
        .btn-official {
            width: 100%; padding: 10px; background: var(--accent-blue); color: white;
            border: none; border-radius: 6px; font-weight: 700; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s;
            text-decoration: none;
        }
        .btn-official:hover { background: #2563eb; }

        /* Available on server — green */
        .btn-official.available { background: #10b981; }
        .btn-official.available:hover { background: #059669; }

        /* Not uploaded yet — muted */
        .btn-official.unavailable { background: #475569; cursor: default; }

        /* Loading spinner */
        .btn-official.loading { opacity: 0.7; cursor: wait; }

        /* File type badges on cards */
        .file-type-badge {
            display: inline-block; padding: 1px 6px; border-radius: 3px;
            font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: .5px; vertical-align: middle; margin-left: 4px;
        }
        .badge-exe { background: rgba(59,130,246,.15); color: #3b82f6; border: 1px solid rgba(59,130,246,.4); }
        .badge-zip { background: rgba(245,158,11,.15); color: #f59e0b; border: 1px solid rgba(245,158,11,.4); }

        footer { padding: 40px; text-align: center; border-top: 1px solid var(--border-color); margin-top: 60px; color: var(--text-gray); font-size: 0.8rem; }

        @media (max-width: 900px) {
            .menu-toggle { display: block; }
            .nav-center {
                display: none; position: absolute; top: 100%; left: 0; width: 100%;
                background-color: var(--nav-bg); border-bottom: 1px solid var(--border-color);
                padding: 20px 0; flex-direction: column;
            }
            .nav-center.active { display: flex !important; }
            .nav-links { flex-direction: column; gap: 20px; width: 100%; text-align: center; }
            .search-wrap { margin-top: 10px; }
            .search-input { width: 200px; opacity: 1; padding: 6px 12px 6px 40px; }
            .filter-header h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

</nav>

<header class="filter-header">
    <h1>Official Game Library</h1>
    <p>Download authentic game executables straight from our server</p>
    <div class="filter-tags">
        <button class="tag-btn active" onclick="filterBy('all')">All Games</button>
        <button class="tag-btn" onclick="filterBy('action')">Action</button>
        <button class="tag-btn" onclick="filterBy('rpg')">RPG</button>
        <button class="tag-btn" onclick="filterBy('racing')">Racing</button>

        <button class="tag-btn" onclick="filterBy('sports')">Sports</button>
    </div>
</header>

<div class="container">
    <div class="game-grid" id="gameGrid"></div>
</div>

<footer>© 2026 The Gamer's HUB. Connecting the Global Gaming Universe.</footer>

<script>
    const games = [
        // ACTION
        { gid: "GH-ACT-001", title: "Elden Ring",                      cat: "action",   icon: "fa-fire-alt",        color: "var(--cat-action)",   image: "HDpro pictures/elden-ring.jpg" },
        { gid: "GH-ACT-002", title: "God of War Ragnarök",              cat: "action",   icon: "fa-gavel",           color: "var(--cat-action)",   image: "HDpro pictures/god-of-war.jpg" },
        { gid: "GH-ACT-003", title: "Sekiro: Shadows Die Twice",        cat: "action",   icon: "fa-dragon",          color: "var(--cat-action)",   image: "HDpro pictures/shadow-dies-twice-2.jpg" },
        { gid: "GH-ACT-004", title: "Ghost of Tsushima",                cat: "action",   icon: "fa-khanda",          color: "var(--cat-action)",   image: "HDpro pictures/ghost-of-tsushima.jpg" },
        { gid: "GH-ACT-005", title: "Spider-Man 2",                     cat: "action",   icon: "fa-spider",          color: "var(--cat-action)",   image: "HDpro pictures/marvels-spider-man.jpeg" },
        { gid: "GH-ACT-006", title: "Hades II",                         cat: "action",   icon: "fa-skull-crossbones",color: "var(--cat-action)",   image: "HDpro pictures/hades.jpg" },
        // RPG
        { gid: "GH-RPG-001", title: "The Witcher 3: Wild Hunt",         cat: "rpg",      icon: "fa-wand-sparkles",   color: "var(--cat-rpg)",      image: "HDpro pictures/witcher-3.jpg" },
        { gid: "GH-RPG-002", title: "Baldur's Gate 2",                  cat: "rpg",      icon: "fa-dice-d20",        color: "var(--cat-rpg)",      image: "HDpro pictures/baldurs-gate-3.jpg" },
        { gid: "GH-RPG-003", title: "Final Fantasy VII Rebirth",        cat: "rpg",      icon: "fa-meteor",          color: "var(--cat-rpg)",      image: "HDpro pictures/ff7-rebirth.jpg" },
        { gid: "GH-RPG-004", title: "Persona 5 Royal",                  cat: "rpg",      icon: "fa-mask",            color: "var(--cat-rpg)",      image: "HDpro pictures/persona-5.jpg" },
        { gid: "GH-RPG-005", title: "The Elder Scrolls V: Skyrim",      cat: "rpg",      icon: "fa-scroll",          color: "var(--cat-rpg)",      image: "HDpro pictures/skyrim.jpg" },
        { gid: "GH-RPG-006", title: "Mass Effect Legendary Edition",    cat: "rpg",      icon: "fa-rocket",          color: "var(--cat-rpg)",      image: "HDpro pictures/mass-effect.jpg" },
        // RACING
        { gid: "GH-RAC-001", title: "Forza Horizon 5",                  cat: "racing",   icon: "fa-car",             color: "var(--cat-racing)",   image: "HDpro pictures/horizon-5.jpg" },
        { gid: "GH-RAC-002", title: "NFS Carbon Collectors Edition",                      cat: "racing",   icon: "fa-gauge-high",      color: "var(--cat-racing)",   image: "HDpro pictures/NFS Carbon Collectors Edition.jpg" },
        { gid: "GH-RAC-003", title: "F1 24",                            cat: "racing",   icon: "fa-trophy",          color: "var(--cat-racing)",   image: "HDpro pictures/f1-24.jpg" },
        { gid: "GH-RAC-004", title: "Assetto Corsa Competizione",       cat: "racing",   icon: "fa-road",            color: "var(--cat-racing)",   image: "HDpro pictures/mercedes-amg-gt3.jpg" },
        { gid: "GH-RAC-005", title: "Dirt 5",                           cat: "racing",   icon: "fa-mountain-sun",    color: "var(--cat-racing)",   image: "HDpro pictures/dirt-5.jpg" },
        { gid: "GH-RAC-006", title: "Burnout Paradise",                 cat: "racing",   icon: "fa-bolt",            color: "var(--cat-racing)",   image: "HDpro pictures/burnout-paradise.png" },
        // SHOOTING
        { gid: "GH-SHT-001", title: "Call of Duty: Black Ops 6",        cat: "shooting", icon: "fa-crosshairs",      color: "var(--cat-shooting)", image: "HDpro pictures/call-of-duty-black-ops-6.png" },
        { gid: "GH-SHT-002", title: "Valorant",                         cat: "shooting", icon: "fa-gun",             color: "var(--cat-shooting)", image: "HDpro pictures/valorant.jpeg" },
        { gid: "GH-SHT-003", title: "Counter-Strike 2",                 cat: "shooting", icon: "fa-shield-halved",   color: "var(--cat-shooting)", image: "HDpro pictures/counter-strike-2.png" },
        { gid: "GH-SHT-004", title: "Doom Eternal",                     cat: "shooting", icon: "fa-fire",            color: "var(--cat-shooting)", image: "HDpro pictures/doom-eterna.jpg" },
        { gid: "GH-SHT-005", title: "Halo Infinite",                    cat: "shooting", icon: "fa-user-astronaut",  color: "var(--cat-shooting)", image: "HDpro pictures/halo-infinite.jpg" },
        { gid: "GH-SHT-006", title: "Cyberpunk 2077",                   cat: "shooting", icon: "fa-microchip",       color: "var(--cat-shooting)", image: "HDpro pictures/cyberpunk-2077.jpg" },
        // STRATEGY
        { gid: "GH-STR-001", title: "Age of Empires IV",                cat: "strategy", icon: "fa-chess-rook",      color: "var(--cat-strategy)", image: "HDpro pictures/age-of-empires-iv.jpg" },
        { gid: "GH-STR-002", title: "Civilization VI",                  cat: "strategy", icon: "fa-earth-americas",  color: "var(--cat-strategy)", image: "HDpro pictures/civilization-vi.jpg" },
        { gid: "GH-STR-003", title: "Total War: Warhammer III",         cat: "strategy", icon: "fa-hat-wizard",      color: "var(--cat-strategy)", image: "HDpro pictures/total-war-warhammer-iii.jpg" },
        { gid: "GH-STR-004", title: "Manor Lords",                      cat: "strategy", icon: "fa-hammer",          color: "var(--cat-strategy)", image: "HDpro pictures/manor-lords.jpg" },
        { gid: "GH-STR-005", title: "StarCraft II",                     cat: "strategy", icon: "fa-satellite",       color: "var(--cat-strategy)", image: "HDpro pictures/starcraft2.jpg" },
        { gid: "GH-STR-006", title: "Stellaris",                        cat: "strategy", icon: "fa-shuttle-space",   color: "var(--cat-strategy)", image: "HDpro pictures/stellaris-lithoids.jpg" },
        // SPORTS
        { gid: "GH-SPT-001", title: "FC 25",                            cat: "sports",   icon: "fa-futbol",          color: "var(--cat-sports)",   image: "HDpro pictures/fc-25.jpg" },
        { gid: "GH-SPT-002", title: "NBA 2K25",                         cat: "sports",   icon: "fa-basketball",      color: "var(--cat-sports)",   image: "HDpro pictures/nba-2k25.jpg" },
        { gid: "GH-SPT-003", title: "WWE 2K24",                         cat: "sports",   icon: "fa-hand-fist",       color: "var(--cat-sports)",   image: "HDpro pictures/wwe-2k24.jpg" },
        { gid: "GH-SPT-004", title: "Rocket League",                    cat: "sports",   icon: "fa-car-side",        color: "var(--cat-sports)",   image: "HDpro pictures/rocket-league.jpg" },
        { gid: "GH-SPT-005", title: "Madden NFL 25",                    cat: "sports",   icon: "fa-football",        color: "var(--cat-sports)",   image: "HDpro pictures/Madden NFL 25.jpg" },
        { gid: "GH-SPT-006", title: "Tony Hawk's Pro Skater",           cat: "sports",   icon: "fa-person-skating",  color: "var(--cat-sports)",   image: "HDpro pictures/tony-hawks-pro.jpg" }
    ];

    // ── Fetch available games from games.php once and cache ──────────────────
    // Maps gid (e.g. GH-ACT-001) → true/false (available on server)
    let serverGameSet = new Set();
    let serverGameMap = {}; // gid → full game object (includes file_type)

    async function loadServerGames() {
        try {
            const res = await fetch('games.php?json');
            if (!res.ok) return;
            const data = await res.json();
            data.forEach(g => {
                if (g.game_id) {
                    const key = g.game_id.toUpperCase();
                    serverGameSet.add(key);
                    serverGameMap[key] = g;
                }
            });
        } catch (e) {
            console.warn('Could not reach games.php:', e);
        }
    }

    // ── Download handler — uses gid directly ────────────────────────────────
    async function downloadGame(btn, gid) {
        // If not in cache, do a fresh check before giving up
        if (!serverGameSet.has(gid.toUpperCase())) {
            await loadServerGames();
        }

        if (!serverGameSet.has(gid.toUpperCase())) {
            btn.innerHTML = '<i class="fa-solid fa-xmark"></i> Not Available';
            btn.classList.add('unavailable');
            setTimeout(() => {
                btn.innerHTML = '<i class="fa-solid fa-download"></i> GET ORIGINAL GAME';
                btn.classList.remove('unavailable');
            }, 2500);
            return;
        }

        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Starting...';
        btn.classList.add('loading');

        const link = document.createElement('a');
        link.href = `games.php?download=${encodeURIComponent(gid.toUpperCase())}`;
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        setTimeout(() => {
            btn.innerHTML = '<i class="fa-solid fa-download"></i> GET ORIGINAL GAME';
            btn.classList.remove('loading');
        }, 2000);
    }

    // ── Render grid ──────────────────────────────────────────────────────────
    function renderLibrary(filter) {
        const grid = document.getElementById('gameGrid');
        grid.innerHTML = '';

        games.forEach(game => {
            if (filter !== 'all' && game.cat !== filter) return;

            const inServer  = serverGameSet.has(game.gid.toUpperCase());
            const serverMeta = serverGameMap[game.gid.toUpperCase()];
            const fileType  = serverMeta ? (serverMeta.file_type || '').toUpperCase() : '';
            const btnClass  = inServer ? 'btn-official available' : 'btn-official';

            // File type badge (only shown when available)
            const typeBadge = inServer && fileType
                ? `<span class="file-type-badge badge-${fileType.toLowerCase()}">${fileType}</span>`
                : '';

            const metaText = inServer
                ? `✔ Available &nbsp;${typeBadge}`
                : 'Official Digital Key';

            const card = `
                <div class="game-card" data-gid="${game.gid}">
                    <div class="game-thumb">
                        <img src="${game.image}" alt="${game.title}" onerror="this.style.display='none'"/>
                        <span class="cat-badge" style="--badge-color:${game.color}">${game.cat}</span>
                    </div>
                    <div class="game-info">
                        <h3 class="game-title">${game.title}</h3>
                        <span class="game-meta">${metaText}</span>
                        <button class="${btnClass}" onclick="downloadGame(this, '${game.gid}')">
                            <i class="fa-solid fa-download"></i> GET ORIGINAL GAME
                        </button>
                    </div>
                </div>
            `;
            grid.innerHTML += card;
        });
    }

    function filterBy(cat) {
        renderLibrary(cat);
        document.querySelectorAll('.tag-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.innerText.toLowerCase().includes(cat) || (cat === 'all' && btn.innerText.toLowerCase() === 'all games')) {
                btn.classList.add('active');
            }
        });
    }

    // ── Boot ─────────────────────────────────────────────────────────────────
    (async () => {
        await loadServerGames();

        // Check for ?category= URL param (set by games.html category cards)
        const params   = new URLSearchParams(window.location.search);
        const catParam = (params.get('category') || 'all').toLowerCase().trim();

        // Valid categories in this library
        const validCats = ['all', 'action', 'rpg', 'racing', 'shooting', 'strategy', 'sports'];
        const startCat  = validCats.includes(catParam) ? catParam : 'all';

        renderLibrary(startCat);

        // Highlight the matching tag button
        document.querySelectorAll('.tag-btn').forEach(btn => {
            btn.classList.remove('active');
            const label = btn.innerText.toLowerCase().trim();
            if (
                (startCat === 'all'      && label === 'all games') ||
                (startCat !== 'all'      && label === startCat)
            ) {
                btn.classList.add('active');
            }
        });

        // Smooth-scroll to the game grid so user lands right at the games
        if (startCat !== 'all') {
            setTimeout(() => {
                const grid = document.getElementById('gameGrid');
                if (grid) grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 150);
        }
    })();
</script>

<script>
    function toggleMenu() {
        const nav = document.getElementById('navMenu');
        if (!nav) return;
        nav.classList.toggle('active');
    }

    document.addEventListener('click', (e) => {
        const nav    = document.getElementById('navMenu');
        const toggle = document.querySelector('.menu-toggle');
        if (!nav || !toggle) return;
        if (nav.classList.contains('active')) {
            if (!nav.contains(e.target) && !toggle.contains(e.target) && window.matchMedia('(max-width: 900px)').matches) {
                nav.classList.remove('active');
            }
        }
    });

    window.addEventListener('resize', () => {
        const nav = document.getElementById('navMenu');
        if (!nav) return;
        if (!window.matchMedia('(max-width: 900px)').matches) {
            nav.classList.remove('active');
            nav.style.display = 'flex';
        } else {
            nav.style.display = nav.classList.contains('active') ? 'block' : 'none';
        }
    });
</script>

</body>
