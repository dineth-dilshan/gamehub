<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Gamer's Hub – Tech News</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #0a0e1a;
      --surface:   #111827;
      --card:      #131c2e;
      --border:    #1e2d45;
      --accent:    #00c6ff;
      --accent2:   #ff4b6e;
      --gold:      #f5c518;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --overlay:   rgba(0,0,0,.85);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Exo 2', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── noise grain overlay ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.03'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    /* ─── NAV ─── */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(8,12,24,.97);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2.2rem; height: 62px;
      gap: 1rem;
    }
    .nav-left { display: flex; align-items: center; }
    .nav-logo {
      display: flex; align-items: center; gap: .55rem;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.25rem; font-weight: 700;
      color: #ffffff; letter-spacing: 1.5px;
      text-decoration: none; white-space: nowrap;
    }
    .nav-logo span {
      animation: glow 2s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% {
        color: #ffffff;
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
      }
      50% {
        color: #26b6ff;
        text-shadow: 0 0 20px rgba(38, 182, 255, 0.8), 0 0 30px rgba(38, 182, 255, 0.5);
      }
    }
    .nav-logo svg { width: 28px; height: 28px; flex-shrink: 0; }
    .nav-links { display: flex; gap: .2rem; list-style: none; margin: 0 auto; }
    .nav-links a {
      color: #8fa3bc; font-size: .8rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.5px;
      text-decoration: none; transition: color .2s;
      padding: .3rem .75rem; border-radius: 4px;
    }
    .nav-links a:hover  { color: #fff; }
    .nav-links a.active { color: var(--gold); }
    .nav-right { display: flex; align-items: center; gap: 1.2rem; }
    .nav-right a {
      display: flex; align-items: center; gap: .35rem;
      color: #8fa3bc; font-size: .8rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      text-decoration: none; transition: color .2s;
    }
    .nav-right a:hover { color: #fff; }
    .nav-right a svg { width: 15px; height: 15px; }

    /* ─── COMING SOON TICKER BAR ─── */
    .ticker-bar {
      background: linear-gradient(90deg, #0d1b35 0%, #06101f 50%, #0d1b35 100%);
      border-bottom: 1px solid var(--border);
      border-top: 1px solid rgba(0,198,255,.18);
      height: 38px;
      display: flex;
      align-items: center;
      overflow: hidden;
      position: relative;
      z-index: 90;
    }

    /* left label badge */
    .ticker-label {
      flex-shrink: 0;
      display: flex; align-items: center; gap: .45rem;
      background: var(--accent2);
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: .78rem; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      padding: 0 1rem;
      height: 100%;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%);
      padding-right: 1.6rem;
      white-space: nowrap;
    }
    .ticker-label .blink-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #fff;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%,100% { opacity: 1; } 50% { opacity: 0; }
    }

    /* scrolling track */
    .ticker-track-wrap {
      flex: 1; overflow: hidden; position: relative;
      mask-image: linear-gradient(90deg, transparent 0%, #000 4%, #000 96%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 4%, #000 96%, transparent 100%);
    }
    .ticker-track {
      display: flex; align-items: center;
      gap: 0;
      animation: tickerScroll 40s linear infinite;
      white-space: nowrap;
    }
    .ticker-track:hover { animation-play-state: paused; }
    @keyframes tickerScroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .ticker-item {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: 0 2.2rem;
      font-size: .78rem; font-weight: 600;
      color: #a8c0d8; letter-spacing: .3px;
      border-right: 1px solid var(--border);
      white-space: nowrap;
    }
    .ticker-item .t-tag {
      font-size: .65rem; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; padding: .1rem .45rem;
      border-radius: 3px; flex-shrink: 0;
    }
    .ticker-item .t-tag.blue  { background: rgba(0,198,255,.15); color: var(--accent); }
    .ticker-item .t-tag.red   { background: rgba(255,75,110,.15); color: var(--accent2); }
    .ticker-item .t-tag.gold  { background: rgba(245,197,24,.15); color: var(--gold); }
    .ticker-item .t-tag.green { background: rgba(0,230,118,.15);  color: #00e676; }
    .ticker-item strong { color: #e2e8f0; }

    /* separator star */
    .ticker-sep {
      color: var(--accent); font-size: .6rem;
      padding: 0 1rem; flex-shrink: 0;
    }

    /* ─── HERO STRIP ─── */
    .hero-strip {
      background: linear-gradient(135deg, #0d1b35 0%, #0a0e1a 60%, #12001a 100%);
      border-bottom: 1px solid var(--border);
      padding: 2.5rem 2rem 2rem;
      position: relative; overflow: hidden;
    }
    .hero-strip::after {
      content: '';
      position: absolute; right: -80px; top: -80px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(0,198,255,.08) 0%, transparent 70%);
    }
    .hero-strip h1 {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700; letter-spacing: 3px;
      background: linear-gradient(90deg, #fff 30%, var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero-strip p {
      color: var(--muted); margin-top: .4rem; font-size: .95rem;
    }

    /* ─── MAIN CONTENT ─── */
    main {
      max-width: 1300px; margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    /* section header */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.8rem;
    }
    .section-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.5rem; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      display: flex; align-items: center; gap: .6rem;
    }
    .section-title::before {
      content: ''; display: block;
      width: 4px; height: 1.4em;
      background: var(--accent); border-radius: 2px;
    }
    .view-all {
      color: var(--accent); font-size: .85rem; font-weight: 600;
      text-decoration: none; letter-spacing: 1px;
      transition: opacity .2s;
    }
    .view-all:hover { opacity: .7; }

    /* ─── FEATURED ROW (top 3 big cards) ─── */
    .featured-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 1.2rem;
      margin-bottom: 2.5rem;
    }
    @media(max-width:900px){ .featured-grid { grid-template-columns: 1fr; } }

    /* ─── NEWS GRID (bottom 5) ─── */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.2rem;
    }

    /* ─── CARD ─── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .25s, border-color .25s, box-shadow .25s;
      display: flex; flex-direction: column;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 32px rgba(0,198,255,.15);
    }

    .card-thumb {
      width: 100%; aspect-ratio: 16/9;
      object-fit: cover; display: block;
      background: var(--surface);
    }

    /* emoji placeholder thumbnails */
    .card-thumb-placeholder {
      width: 100%; aspect-ratio: 16/9;
      display: flex; align-items: center; justify-content: center;
      font-size: 3.5rem;
    }

    .card-body { padding: 1rem 1.1rem 1.2rem; flex: 1; display: flex; flex-direction: column; }

    .card-meta {
      display: flex; align-items: center; gap: .5rem;
      margin-bottom: .55rem;
    }
    .card-date {
      font-size: .72rem; color: var(--muted); letter-spacing: .5px;
    }
    .card-tag {
      font-size: .65rem; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; padding: .15rem .5rem;
      border-radius: 3px; background: rgba(0,198,255,.12); color: var(--accent);
    }
    .card-tag.red  { background: rgba(255,75,110,.12); color: var(--accent2); }
    .card-tag.gold { background: rgba(245,197,24,.12);  color: var(--gold); }

    .card h3 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.1rem; font-weight: 700; line-height: 1.35;
      margin-bottom: .4rem; color: #fff;
    }
    .card p {
      font-size: .82rem; color: var(--muted); line-height: 1.6; flex: 1;
    }
    .card-readmore {
      margin-top: .9rem;
      font-size: .78rem; font-weight: 700;
      color: var(--accent); letter-spacing: .5px;
      text-transform: uppercase;
      display: inline-flex; align-items: center; gap: .3rem;
    }
    .card-readmore::after { content: '→'; }

    /* featured first card – bigger title */
    .card.featured h3 { font-size: 1.35rem; }

    /* ══════════════════════════════════════
       POPUP / MODAL
    ══════════════════════════════════════ */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: var(--overlay);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
      opacity: 0; pointer-events: none;
      transition: opacity .3s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      max-width: 780px; width: 100%;
      max-height: 90vh; overflow-y: auto;
      transform: translateY(30px) scale(.97);
      transition: transform .35s cubic-bezier(.22,1,.36,1);
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .modal-overlay.open .modal { transform: translateY(0) scale(1); }

    .modal-hero {
      width: 100%; aspect-ratio: 16/7;
      overflow: hidden;
      border-radius: 14px 14px 0 0; position: relative;
      background: var(--card);
    }

    .modal-content { padding: 1.5rem 2rem 2rem; }

    .modal-tags { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .8rem; }
    .modal-tag {
      font-size: .7rem; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; padding: .2rem .6rem;
      border-radius: 4px; background: rgba(0,198,255,.12); color: var(--accent);
    }
    .modal-tag.red  { background: rgba(255,75,110,.12); color: var(--accent2); }
    .modal-tag.gold { background: rgba(245,197,24,.12);  color: var(--gold); }

    .modal-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      font-weight: 700; line-height: 1.25; color: #fff;
      margin-bottom: .5rem;
    }
    .modal-date { color: var(--muted); font-size: .8rem; margin-bottom: 1.2rem; }

    .modal-body p {
      font-size: .92rem; color: #9aafc7; line-height: 1.8;
      margin-bottom: 1rem;
    }
    .modal-body h4 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.05rem; font-weight: 700; color: var(--accent);
      margin: 1.3rem 0 .5rem; letter-spacing: 1px; text-transform: uppercase;
    }
    .modal-body ul {
      list-style: none; padding: 0;
    }
    .modal-body ul li {
      padding: .35rem 0 .35rem 1.2rem;
      position: relative; font-size: .88rem; color: #9aafc7; line-height: 1.6;
    }
    .modal-body ul li::before {
      content: '▸'; position: absolute; left: 0; color: var(--accent);
    }

    .modal-close {
      position: absolute; top: 1rem; right: 1rem;
      background: rgba(255,255,255,.08); border: none; border-radius: 50%;
      width: 36px; height: 36px; cursor: pointer; font-size: 1rem;
      color: #fff; display: flex; align-items: center; justify-content: center;
      transition: background .2s; z-index: 10;
    }
    .modal-close:hover { background: rgba(255,75,110,.3); }
    .modal-wrapper { position: relative; }

    /* ─── FOOTER ─── */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem 2rem;
      text-align: center; color: var(--muted); font-size: .8rem;
    }
    footer span { color: var(--accent); }
  </style>
</head>

function buildCard(article, isFeatured = false) {
  const div = document.createElement('div');
  div.className = 'card' + (isFeatured ? ' featured' : '');
  div.onclick = () => openModal(article.id);
  div.innerHTML = `
    <div class="card-img-wrap">
      <img class="card-thumb" src="${article.img}" alt="${article.title}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\'card-thumb-placeholder\' style=\'background:linear-gradient(135deg,#0d1b35,#0a0e1a);aspect-ratio:16/9\'></div>'"/>
    </div>
    <div class="card-body">
      <div class="card-meta">
        <span class="card-tag ${article.tagClass}">${article.tag}</span>
        <span class="card-date">📅 ${article.date}</span>
      </div>
      <h3>${article.title}</h3>
      <p>${article.summary}</p>
      <span class="card-readmore">Read More</span>
    </div>
  `;
  return div;
}

// Render
const featured = document.getElementById('featured');
const more     = document.getElementById('more');

news.slice(0,3).forEach((a, i) => featured.appendChild(buildCard(a, i === 0)));
news.slice(3).forEach(a     => more.appendChild(buildCard(a)));

// Modal
function openModal(id) {
  const a = news.find(n => n.id === id);
  document.getElementById('modalHero').innerHTML = `<img src="${a.img}" alt="${a.title}" style="width:100%;height:100%;object-fit:cover;border-radius:14px 14px 0 0;display:block;"/>`;
  document.getElementById('modalTitle').textContent = a.title;
  document.getElementById('modalDate').textContent  = '📅 ' + a.date;
  document.getElementById('modalTags').innerHTML    = `<span class="modal-tag ${a.tagClass}">${a.tag}</span>`;
  document.getElementById('modalBody').innerHTML    = a.body;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModalBtn() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalBtn();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalBtn(); });
