    <script>
        function loadCart() {
            fetch('get_cart.php')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('cartItemsContainer');
                    if (data.items && data.items.length > 0) {
                        let html = '';
                        data.items.forEach(item => {
                            html += `
                                <div style="background-color: #0f172a; padding: 15px; border-radius: 6px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                                    <div style="flex: 1;">
                                        <div style="font-weight: bold; margin-bottom: 5px;">${item.product_name}</div>
                                        <div style="color: #94a3b8; font-size: 0.9rem;">Rs. ${item.product_price}</div>
                                        <div style="color: #26b6ff; font-weight: bold;">Qty: ${item.quantity}</div>
                                    </div>
                                    <div style="font-weight: bold; font-size: 1.1rem; margin: 0 20px;">Rs. ${item.item_total}</div>
                                    <button onclick="removeFromCart(${item.id})" style="background-color: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">Remove</button>
                                </div>
                            `;
                        });
                        container.innerHTML = html;
                        document.getElementById('subtotal').textContent = `Rs. ${data.total}`;
                        document.getElementById('total').textContent = `Rs. ${data.total}`;
                    } else {
                        container.innerHTML = '<div style="text-align: center; padding: 40px; color: #94a3b8;"><i class="fas fa-shopping-cart" style="font-size: 3rem; margin-bottom: 15px; opacity: 0.5; display: block;"></i><p>Your cart is empty</p><a href="storehome.html" style="color: #26b6ff; text-decoration: underline;">Continue Shopping</a></div>';
                        document.getElementById('subtotal').textContent = 'Rs. 0';
                        document.getElementById('total').textContent = 'Rs. 0';
                    }
                });
        }

        function removeFromCart(itemId) {
            const formData = new FormData();
            formData.append('cart_id', itemId);

            fetch('remove_from_cart.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    loadCart();
                } else {
                    alert('Failed to remove item');
                }
            });
        }

        function clearCart() {
            if (confirm('Are you sure you want to clear your cart?')) {
                fetch('clear_cart.php', {
                    method: 'POST'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        loadCart();
                    }
                });
            }
        }

        function checkout() {
            alert('Checkout functionality coming soon!');
        }

        // Avatar dropdown toggle
        function toggleDropdown(event) {
            event.stopPropagation();
            const menu = document.getElementById('dropdownMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function() {
            const menu = document.getElementById('dropdownMenu');
            if (menu) menu.style.display = 'none';
        });

        // Logout function
        function logout() {
            window.location.href = 'logout.php';
        }

        // Load wishlist count
        function loadWishlistCount() {
            fetch('get_wishlist_count.php')
                .then(response => response.json())
                .then(data => {
                    const wishlistCount = document.getElementById('wishlistCount');
                    if (data.count > 0) {
                        wishlistCount.textContent = data.count;
                        wishlistCount.style.display = 'flex';
                    } else {
                        wishlistCount.style.display = 'none';
                    }
                });
        }

        // Load counts on page load
        loadWishlistCount();
        setInterval(loadWishlistCount, 5000);

        // Load cart on page load
        loadCart();
    </script>
